<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overwatch 2 - Counter Picker Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151b2b;
      --accent-orange: #f99e1a;
      --text-main: #f0f4f8;
      --text-muted: #9aa8b9;
      --tank-color: #3b82f6;
      --dps-color: #ef4444;
      --support-color: #10b981;
      --border-radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 2.5rem; text-transform: uppercase; font-style: italic; font-weight: 900; letter-spacing: -1px; }
    header span { color: var(--accent-orange); }
    header p { color: var(--text-muted); font-size: 1.1rem; margin-top: 5px; }

    .app-container { width: 100%; max-width: 1250px; display: flex; flex-direction: column; gap: 30px; }

    .dashboard { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    @media (max-width: 950px) { .dashboard { grid-template-columns: 1fr; } }

    .selected-hero-card {
      background: var(--card-bg); border-radius: var(--border-radius); padding: 30px 20px;
      text-align: center; border: 1px solid #2d3848; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    
    .hero-portrait {
      width: 140px; height: 140px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: bold; background: #2d3848; border: 4px solid var(--accent-orange); margin-bottom: 15px;
      text-transform: uppercase; overflow: hidden; background-size: cover; background-position: center;
    }
    
    .selected-hero-card h2 { font-size: 2rem; margin-bottom: 10px; font-style: italic; text-transform: uppercase; }
    .hero-role-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; background: #2a3546; letter-spacing: 1px; margin-bottom: 20px;}
    .role-tank { color: var(--tank-color); }
    .role-damage { color: var(--dps-color); }
    .role-support { color: var(--support-color); }

    .hero-stats-container { width: 100%; background: #0f1422; border-radius: 8px; padding: 15px; border: 1px solid #2d3848; margin-bottom: 20px; }
    .hp-bar-wrapper { width: 100%; height: 24px; background: #2d3848; border-radius: 12px; display: flex; overflow: hidden; margin-bottom: 10px; }
    .bar-hp { background: #10b981; height: 100%; }
    .bar-armor { background: #f59e0b; height: 100%; }
    .bar-shield { background: #3b82f6; height: 100%; }
    
    .stats-text { display: flex; justify-content: center; gap: 15px; font-size: 0.85rem; font-weight: bold; }
    .stats-text span { display: flex; align-items: center; gap: 5px; }

    .perks-container { display: flex; gap: 10px; width: 100%; }
    .perk-box { flex: 1; background: #0f1422; border: 1px solid #2d3848; border-radius: 8px; padding: 12px 5px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; }
    .perk-minor { border-top: 3px solid #a78bfa; }
    .perk-major { border-top: 3px solid #fbbf24; }
    .perk-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: bold; }
    .perk-name { font-size: 0.8rem; font-weight: bold; color: var(--text-main); }

    .tabs-container { margin-bottom: 15px; display: flex; gap: 10px; border-bottom: 2px solid #2d3848; padding-bottom: 10px; justify-content: center;}
    .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 1rem; font-weight: bold; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.2s; display: flex; align-items: center; gap: 8px;}
    .tab-btn:hover { background: #2a3546; color: #fff; }
    .tab-btn.active { background: #2a3546; color: var(--accent-orange); }

    .counters-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    @media (max-width: 768px) { .counters-grid { grid-template-columns: 1fr; } }

    .role-column { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; border: 1px solid #2d3848; display: flex; flex-direction: column; gap: 12px; }
    .role-title { font-size: 1.1rem; padding-bottom: 12px; border-bottom: 2px solid #2d3848; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; font-style: italic; font-weight: bold;}
    .role-title.tank { color: var(--tank-color); border-color: var(--tank-color); }
    .role-title.dps { color: var(--dps-color); border-color: var(--dps-color); }
    .role-title.support { color: var(--support-color); border-color: var(--support-color); }

    .counter-item { background: #0f1422; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid transparent; cursor: pointer; transition: transform 0.2s; }
    .counter-item:hover { transform: scale(1.02); background: #1a2235; }
    .counter-item.hard { border-left-color: #ef4444; }
    .counter-item.soft { border-left-color: #f59e0b; }
    .counter-header { display: flex; align-items: center; gap: 10px; }
    .mini-avatar { width: 36px; height: 36px; border-radius: 6px; background-size: cover; background-position: center; background-color: #2d3848; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
    .counter-name { font-weight: 700; font-size: 1rem; flex-grow: 1;}
    .counter-badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; text-transform: uppercase; }
    .badge-hard { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge-soft { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .counter-reason { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-top: 4px;}

    .roster-section { background: var(--card-bg); border-radius: var(--border-radius); padding: 30px; border: 1px solid #2d3848; margin-top: 10px; }
    .roster-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .roster-header h3 { font-size: 1.5rem; text-transform: uppercase; font-style: italic; display: flex; align-items: center; gap: 10px;}
    
    .search-input { padding: 12px 20px; border-radius: 20px; border: 1px solid #3d4a5d; background: #0b0f19; color: #fff; font-size: 1rem; outline: none; width: 100%; max-width: 300px; transition: border-color 0.2s;}
    .search-input:focus { border-color: var(--accent-orange); }

    /* Estructura de 3 columnas para el Roster */
    .roster-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; text-align: center; }
    @media (max-width: 900px) { .roster-columns { grid-template-columns: 1fr; gap: 40px; } }

    .role-group h4 { margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.2rem; text-transform: uppercase; font-style: italic; }
    .hero-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    
    /* Botones visuales solo foto */
    .hero-btn { background: #2a3546; border: 3px solid transparent; border-radius: 12px; width: 65px; height: 65px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1rem;}
    .hero-btn:hover { border-color: #9aa8b9; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .hero-btn.active { border-color: var(--accent-orange); box-shadow: 0 0 15px rgba(249, 158, 26, 0.4); }
    
    /* Tooltip al pasar el ratón */
    .hero-btn::after {
      content: attr(data-name); position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.9); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;
      white-space: nowrap; opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 10;
    }
    .hero-btn:hover::after { bottom: 5px; opacity: 1; }

    .empty-state { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px 0; }
  </style>
</head>

            <span style="color: #10b981;"><i class="fa-solid fa-heart"></i> <span id="txtHp">0</span></span>
            <span style="color: #f59e0b;"><i class="fa-solid fa-shield"></i> <span id="txtArmor">0</span></span>
            <span style="color: #3b82f6;"><i class="fa-solid fa-shield-halved"></i> <span id="txtShield">0</span></span>

        </div>

        <div class="perks-container" id="perksContainer">

          <div class="perk-box perk-major">

          </div>
        </div>
      </div>

      <!-- Panel Derecho: Pestañas y Resultados -->
      <div>
        <div class="tabs-container">
          <button class="tab-btn active" onclick="setTab('counters')" id="tab-counters">
            <i class="fa-solid fa-skull-crossbones"></i> Le hacen counter
          </button>
          <button class="tab-btn" onclick="setTab('strong')" id="tab-strong">
            <i class="fa-solid fa-fire"></i> Fuerte contra
          </button>
          <button class="tab-btn" onclick="setTab('synergy')" id="tab-synergy">
            <i class="fa-solid fa-handshake"></i> Sinergias
          </button>
        </div>

        <div class="counters-grid">
          <div class="role-column">
            <div class="role-title tank"><i class="fa-solid fa-shield-halved"></i> Tanques</div>
            <div id="tankCol"></div>
          </div>
          <div class="role-column">
            <div class="role-title dps"><i class="fa-solid fa-crosshairs"></i> Daño</div>
            <div id="dpsCol"></div>
          </div>
          <div class="role-column">
            <div class="role-title support"><i class="fa-solid fa-heart-pulse"></i> Apoyo</div>
            <div id="supportCol"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Roster en 3 Columnas Centradas -->
    <div class="roster-section">
      <div class="roster-header">
        <h3><i class="fa-solid fa-users"></i> Roster Completo</h3>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar héroe..." oninput="filterHeroes()">
      </div>
      
      <div class="roster-columns">
        <div class="role-group">
          <h4 style="color: var(--tank-color);"><i class="fa-solid fa-shield-halved"></i> Tanques</h4>
          <div class="hero-grid" id="rosterTank"></div>
        </div>
        <div class="role-group">

        </div>
        <div class="role-group">

          <div class="hero-grid" id="rosterSupport"></div>
        </div>
      </div>
    </div>

        "Soldier: 76": "soldier-76",
        "Wrecking Ball": "wrecking-ball",
        "Junker Queen": "junker-queen",
        "D.Va": "dva",
        "Lúcio": "lucio",
        "Torbjörn": "torbjorn"
      };
      if (exceptions[name]) return exceptions[name];
      
      return name.toLowerCase().replace(/[:.\s]/g, '').replace('ö', 'o').replace('ú', 'u');
    }

    async function fetchImages() {
      try {
        const response = await fetch('https://overfast-api.tekrop.fr/heroes');
        const data = await response.json();
        data.forEach(hero => { apiImages[hero.name] = hero.portrait; });
      } catch (e) {
        console.warn("No se pudo contactar con OverFast API. Usando iniciales de fallback.");
      }
      init();
    }

    function getAvatarHTML(name) {
      if (apiImages[name]) return `background-image: url('${apiImages[name]}'); color: transparent;`;
      return `background-color: #2d3848; color: white;`;
    }
    function getInitials(name) { return name.substring(0, 2).toUpperCase(); }

    function init() {
      renderRoster();
      selectHero(selectedHeroKey);
    }

    function renderRoster() {
      const tankBox = document.getElementById('rosterTank');
      const damageBox = document.getElementById('rosterDamage');
      const supportBox = document.getElementById('rosterSupport');

      tankBox.innerHTML = ''; damageBox.innerHTML = ''; supportBox.innerHTML = '';

      Object.keys(HEROES_DB).sort().forEach(key => {
        const hData = HEROES_DB[key];
        const btn = document.createElement('button');
        btn.className = `hero-btn ${key === selectedHeroKey ? 'active' : ''}`;
        btn.dataset.name = key;
        btn.style = getAvatarHTML(key);
        btn.innerHTML = apiImages[key] ? '' : getInitials(key);
        btn.onclick = () => {
          selectHero(key);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        if (hData.role === 'Tank') tankBox.appendChild(btn);
        else if (hData.role === 'Damage') damageBox.appendChild(btn);
        else if (hData.role === 'Support') supportBox.appendChild(btn);
      });
    }

    function getHeroExtras(heroName, role) {
      let stats = { hp: 250, armor: 0, shield: 0 };
      if (HEROES_DB[heroName] && HEROES_DB[heroName].stats) {
        stats = HEROES_DB[heroName].stats;
      } else {
        if (role === 'Tank') stats = { hp: 450, armor: 100, shield: 0 };
        if (role === 'Support') stats = { hp: 250, armor: 0, shield: 0 };
      }

      let strongAgainst = [];
      Object.keys(HEROES_DB).forEach(k => {
        if(HEROES_DB[k].counters) {
          HEROES_DB[k].counters.forEach(c => {
            if(c.name === heroName) strongAgainst.push({ name: k, role: HEROES_DB[k].role.toLowerCase(), type: c.type, reason: c.reason });
          });
        }
      });

      let synergy = [];
      if(role === 'Damage') synergy.push({ name: 'Mercy', role: 'support', type: 'soft', reason: 'Potencia su daño (Damage Boost).' });
      if(role === 'Tank') synergy.push({ name: 'Ana', role: 'support', type: 'hard', reason: 'Sana masivamente tanques grandes.' });
      if(role === 'Support') synergy.push({ name: 'Reinhardt', role: 'tank', type: 'soft', reason: 'Protege las líneas traseras.' });

      return { stats, strongAgainst, synergy };
    }

    async function selectHero(heroName) {
      selectedHeroKey = heroName;
      const data = HEROES_DB[heroName];
      if (!data) return;

      const extras = getHeroExtras(heroName, data.role);

      // Info Héroe
      document.getElementById('targetName').innerText = heroName;
      let roleIcon = data.role === 'Tank' ? '<i class="fa-solid fa-shield-halved"></i> Tanque' : (data.role === 'Damage' ? '<i class="fa-solid fa-crosshairs"></i> Daño' : '<i class="fa-solid fa-heart-pulse"></i> Apoyo');
      const roleClass = data.role === 'Tank' ? 'role-tank' : (data.role === 'Damage' ? 'role-damage' : 'role-support');
      
      let roleBadge = document.getElementById('targetRole');
      roleBadge.innerHTML = roleIcon;
      roleBadge.className = `hero-role-badge ${roleClass}`;
      
      const targetImg = document.getElementById('targetImg');
      targetImg.style = getAvatarHTML(heroName);
      targetImg.style.borderColor = data.role === 'Tank' ? 'var(--tank-color)' : (data.role === 'Damage' ? 'var(--dps-color)' : 'var(--support-color)');
      targetImg.innerHTML = apiImages[heroName] ? '' : getInitials(heroName);

      // Botones activos
      document.querySelectorAll('.hero-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.name === heroName);
      });

      // Pestañas
      window.currentCounters = data.counters || [];
      window.currentStrong = extras.strongAgainst;
      window.currentSynergy = extras.synergy;
      setTab(activeTab);

      // --- API FETCH PARA STATS Y PERKS AUTOMÁTICOS ---
      document.getElementById('txtHp').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      document.getElementById('txtArmor').innerText = '-';
      document.getElementById('txtShield').innerText = '-';
      
      const perksContainer = document.getElementById('perksContainer');
      if (data.perks) {
        perksContainer.style.display = 'flex';
        document.getElementById('txtMinorPerk').innerText = data.perks.minor;
        document.getElementById('txtMajorPerk').innerText = data.perks.major;
      } else {
        perksContainer.style.display = 'none';
      }

      try {
        const slug = getHeroSlug(heroName);
        let heroApiData = null;

        // Caché para no volver a descargar los datos si ya hicimos clic en este héroe antes
        if (window.heroApiCache && window.heroApiCache[slug]) {
          heroApiData = window.heroApiCache[slug];
        } else {
          const res = await fetch(`https://overfast-api.tekrop.fr/heroes/${slug}`);
          if (res.ok) {
            heroApiData = await res.json();
            if (!window.heroApiCache) window.heroApiCache = {};
            window.heroApiCache[slug] = heroApiData; // Guardamos en memoria
          }
        }

        if (heroApiData) {
          // 1. Asignar Vida/Armadura/Escudo real desde la API
          const stats = heroApiData.hitpoints || { health: extras.stats.hp, armor: extras.stats.armor, shields: extras.stats.shield };
          
          document.getElementById('txtHp').innerText = stats.health || 0;
          document.getElementById('txtArmor').innerText = stats.armor || 0;
          document.getElementById('txtShield').innerText = stats.shields || 0;
          
          const totalHP = (stats.health || 0) + (stats.armor || 0) + (stats.shields || 0) || 1;
          document.getElementById('barHp').style.width = `${((stats.health || 0) / totalHP) * 100}%`;
          document.getElementById('barArmor').style.width = `${((stats.armor || 0) / totalHP) * 100}%`;
          document.getElementById('barShield').style.width = `${((stats.shields || 0) / totalHP) * 100}%`;

        } else {
           throw new Error("Sin datos en la API");
        }

      } catch (e) {
        // Fallback de rescate si el héroe es muy nuevo (como Shion) y la API oficial aún no lo tiene
        document.getElementById('txtHp').innerText = extras.stats.hp;
        document.getElementById('txtArmor').innerText = extras.stats.armor;
        document.getElementById('txtShield').innerText = extras.stats.shield;
        
        const totalHP = extras.stats.hp + extras.stats.armor + extras.stats.shield || 1;
        document.getElementById('barHp').style.width = `${(extras.stats.hp / totalHP) * 100}%`;
        document.getElementById('barArmor').style.width = `${(extras.stats.armor / totalHP) * 100}%`;
        document.getElementById('barShield').style.width = `${(extras.stats.shield / totalHP) * 100}%`;
      }
    }

    function setTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');

      if(tabName === 'counters') renderCards(window.currentCounters);
      else if(tabName === 'strong') renderCards(window.currentStrong);
      else if(tabName === 'synergy') renderCards(window.currentSynergy);
    }

    function renderCards(list) {
      const tankBox = document.getElementById('tankCol');
      const dpsBox = document.getElementById('dpsCol');
      const supportBox = document.getElementById('supportCol');
      tankBox.innerHTML = ''; dpsBox.innerHTML = ''; supportBox.innerHTML = '';

      if(!list || list.length === 0) {
        const emptyMsg = '<div class="empty-state">No hay datos en esta categoría.</div>';
        tankBox.innerHTML = emptyMsg; dpsBox.innerHTML = emptyMsg; supportBox.innerHTML = emptyMsg;
        return;
      }

      list.forEach(item => {
        const badgeClass = item.type === 'hard' ? 'badge-hard' : 'badge-soft';
        const cardClass = item.type === 'hard' ? 'hard' : 'soft';
        
        const cardHTML = `
          <div class="counter-item ${cardClass}" onclick="selectHero('${item.name}')">
            <div class="counter-header">
              <div class="mini-avatar" style="${getAvatarHTML(item.name)}">${apiImages[item.name] ? '' : getInitials(item.name)}</div>
              <span class="counter-name">${item.name}</span>
              <span class="counter-badge ${badgeClass}">${item.type}</span>
            </div>
            <div class="counter-reason">${item.reason}</div>
          </div>
        `;

        if (item.role === 'tank') tankBox.innerHTML += cardHTML;
        else if (item.role === 'damage' || item.role === 'dps') dpsBox.innerHTML += cardHTML;
        else if (item.role === 'support') supportBox.innerHTML += cardHTML;
      });

      if(tankBox.innerHTML === '') tankBox.innerHTML = '<div class="empty-state">-</div>';
      if(dpsBox.innerHTML === '') dpsBox.innerHTML = '<div class="empty-state">-</div>';
      if(supportBox.innerHTML === '') supportBox.innerHTML = '<div class="empty-state">-</div>';
    }

    function filterHeroes() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.hero-btn').forEach(btn => {
        const name = btn.dataset.name.toLowerCase();
        btn.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }

    window.onload = fetchImages;
  </script>
</body>
</html>
