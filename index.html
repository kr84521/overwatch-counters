<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overwatch 2 - Counter Picker Completo</title>
  
  <!-- FontAwesome para los iconos profesionales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #121822;
      --card-bg: #1e2736;
      --accent-orange: #f99e1a;
      --text-main: #f0f4f8;
      --text-muted: #9aa8b9;
      --tank-color: #3b82f6;
      --dps-color: #ef4444;
      --support-color: #10b981;
      --border-radius: 12px;
      /* Nuevos colores para las categorías de counter */
      --color-hard: #ef4444; /* Rojo para Hard Counter */
      --color-favorable: #f97316; /* Naranja para Favorable */
      --color-light: #eab308; /* Amarillo para Ligera */
      --color-skill: #3b82f6; /* Azul para Skill Matchup */
      --color-disadvantage: #9ca3af; /* Gris para Desventaja */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 2.5rem; text-transform: uppercase; font-style: italic; font-weight: 800; letter-spacing: -1px; }
    header span { color: var(--accent-orange); }
    header p { color: var(--text-muted); font-size: 1.1rem; }

    .app-container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 30px; }

    /* DASHBOARD */
    .dashboard { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }

    .selected-hero-card {
      background: var(--card-bg); border-radius: var(--border-radius); padding: 30px 20px;
      text-align: center; border: 1px solid #2d3848; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .hero-portrait-container { position: relative; margin-bottom: 20px; }
    .hero-portrait {
      width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: bold; background: #2d3848; border: 4px solid var(--accent-orange); overflow: hidden;
      text-transform: uppercase;
    }
    .hero-portrait img { width: 100%; height: 100%; object-fit: cover; }
    
    .selected-hero-card h2 { font-size: 2.2rem; margin-bottom: 10px; font-style: italic; text-transform: uppercase; }
    .hero-role-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; background: #2a3546; letter-spacing: 1px;}
    .role-tank { color: var(--tank-color); }
    .role-damage { color: var(--dps-color); }
    .role-support { color: var(--support-color); }

    /* STATS & PERKS */
    .stats-container { display: flex; gap: 10px; margin-top: 20px; width: 100%; justify-content: center; }
    .stat-badge { display: flex; flex-direction: column; align-items: center; background: #141a24; padding: 8px 12px; border-radius: 8px; flex: 1; border: 1px solid #2d3848;}
    .stat-badge i { font-size: 1.2rem; margin-bottom: 5px; }
    .stat-badge span { font-weight: bold; font-size: 1.1rem; }
    .stat-hp i { color: #10b981; }
    .stat-armor i { color: #f59e0b; }
    .stat-shield i { color: #3b82f6; }

    .perks-container { width: 100%; margin-top: 20px; background: #141a24; border-radius: 8px; padding: 15px; border: 1px solid #2d3848; display: none; }
    .perks-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
    .perks-grid { display: flex; gap: 10px; justify-content: center; }
    .perk-box { flex: 1; background: #2a3546; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; color: #fff; line-height: 1.2;}
    .perk-major { border-left: 3px solid var(--accent-orange); }
    .perk-minor { border-left: 3px solid #9aa8b9; }

    /* TABS & COUNTERS */
    .right-panel { display: flex; flex-direction: column; gap: 15px; }
    .tabs-header { display: flex; gap: 10px; background: var(--card-bg); padding: 10px; border-radius: var(--border-radius); border: 1px solid #2d3848; }
    .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); font-size: 1rem; font-weight: bold; padding: 10px; cursor: pointer; border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .tab-btn:hover { background: #2a3546; color: #fff; }
    .tab-btn.active { background: #2a3546; color: var(--accent-orange); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .counters-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    @media (max-width: 768px) { .counters-grid { grid-template-columns: 1fr; } }

    .role-column { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; border: 1px solid #2d3848; display: flex; flex-direction: column; gap: 15px; }
    .role-title { font-size: 1.2rem; padding-bottom: 15px; border-bottom: 2px solid #2d3848; display: flex; align-items: center; gap: 8px; text-transform: uppercase; font-style: italic; }
    .role-title.tank { color: var(--tank-color); border-color: var(--tank-color); }
    .role-title.dps { color: var(--dps-color); border-color: var(--dps-color); }
    .role-title.support { color: var(--support-color); border-color: var(--support-color); }

    .counter-item { background: #141a24; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid transparent; cursor: pointer; transition: transform 0.2s; }
    .counter-item:hover { transform: translateX(5px); }
    
    /* Clases de colores para las estrellas/ventajas */
    .counter-item.star-5 { border-left-color: var(--color-hard); }
    .counter-item.star-4 { border-left-color: var(--color-favorable); }
    .counter-item.star-3 { border-left-color: var(--color-light); }
    .counter-item.star-2 { border-left-color: var(--color-skill); }
    .counter-item.star-1 { border-left-color: var(--color-disadvantage); }
    .counter-item.synergy { border-left-color: var(--support-color); }

    .counter-header { display: flex; align-items: center; gap: 10px; }
    .counter-img { width: 35px; height: 35px; border-radius: 5px; object-fit: cover; background: #2d3848; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; overflow: hidden; }
    .counter-img img { width: 100%; height: 100%; object-fit: cover; }
    .counter-name { font-weight: 700; font-size: 1rem; flex-grow: 1; }
    
    .stars-container { display: flex; gap: 2px; font-size: 0.8rem; }
    .star-filled { color: #fbbf24; }
    .star-empty { color: #4b5563; }
    
    .counter-category { font-size: 0.7rem; padding: 2px 6px; border-radius: 12px; font-weight: bold; text-transform: uppercase; align-self: flex-start; margin-bottom: 2px;}
    .cat-hard { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .cat-favorable { background: rgba(249, 115, 22, 0.2); color: #fdba74; }
    .cat-light { background: rgba(234, 179, 8, 0.2); color: #fde047; }
    .cat-skill { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }

    .counter-reason { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; margin-top: 4px; }

    /* ROSTER */
    .roster-section { background: var(--card-bg); border-radius: var(--border-radius); padding: 25px; border: 1px solid #2d3848; margin-top: 20px; }
    .roster-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .roster-header h3 { font-size: 1.5rem; text-transform: uppercase; font-style: italic; }
    
    .search-input { padding: 10px 20px; border-radius: 20px; border: 1px solid #3d4a5d; background: #121822; color: #fff; font-size: 1rem; outline: none; width: 100%; max-width: 300px; }
    .search-input:focus { border-color: var(--accent-orange); }

    .roster-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: center; }
    @media (max-width: 900px) { .roster-columns { grid-template-columns: 1fr; } }
    
    .role-group h4 { margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1rem; color: var(--text-muted); text-transform: uppercase; }
    
    .hero-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    
    .hero-btn {
      width: 65px; height: 65px; background: #2a3546; border: 3px solid transparent; border-radius: 10px; 
      cursor: pointer; transition: all 0.2s; position: relative; display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-weight: bold; color: #fff; font-size: 1.2rem;
    }
    .hero-btn img { width: 100%; height: 100%; object-fit: cover; }
    .hero-btn:hover { transform: translateY(-3px); border-color: #9aa8b9; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .hero-btn.active { border-color: var(--accent-orange); }
    
    .hero-btn::after {
      content: attr(data-name); position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap; z-index: 10;
    }
    .hero-btn:hover::after { opacity: 1; bottom: 70px; }

  </style>
</head>
<body>

  <header>
    <h1>Overwatch <span>Counters</span></h1>
    <p>Selecciona tu objetivo y domina el *matchup*</p>
  </header>

  <div class="app-container">
    
    <div class="dashboard">
      <div class="selected-hero-card">
        <div class="hero-portrait-container">
          <div id="targetImg" class="hero-portrait">?</div>
        </div>
        <h2 id="targetName">Selecciona</h2>
        <span id="targetRole" class="hero-role-badge">-</span>
        
        <div class="stats-container">
          <div class="stat-badge stat-hp"><i class="fa-solid fa-heart"></i> <span id="statHealth">-</span></div>
          <div class="stat-badge stat-armor"><i class="fa-solid fa-shield-halved"></i> <span id="statArmor">-</span></div>
          <div class="stat-badge stat-shield"><i class="fa-solid fa-circle-notch"></i> <span id="statShield">-</span></div>
        </div>

        <div class="perks-container" id="perksContainer">
          <div class="perks-title"><i class="fa-solid fa-star"></i> Perks Recomendados</div>
          <div class="perks-grid">
            <div class="perk-box perk-minor" id="perkMinor">-</div>
            <div class="perk-box perk-major" id="perkMajor">-</div>
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="tabs-header">
          <button class="tab-btn active" onclick="switchTab('counters')"><i class="fa-solid fa-crosshairs"></i> Le Hacen Counter</button>
          <button class="tab-btn" onclick="switchTab('strong')"><i class="fa-solid fa-fire"></i> Fuerte contra</button>
        </div>

        <div id="tab-counters" class="tab-content active">
          <div class="counters-grid">
            <div class="role-column"><div class="role-title tank"><i class="fa-solid fa-shield"></i> Tanques</div><div id="tankCounters"></div></div>
            <div class="role-column"><div class="role-title dps"><i class="fa-solid fa-khanda"></i> Daño</div><div id="dpsCounters"></div></div>
            <div class="role-column"><div class="role-title support"><i class="fa-solid fa-leaf"></i> Apoyo</div><div id="supportCounters"></div></div>
          </div>
        </div>

        <div id="tab-strong" class="tab-content">
          <div class="counters-grid">
            <div class="role-column"><div class="role-title tank"><i class="fa-solid fa-shield"></i> Tanques</div><div id="tankStrong"></div></div>
            <div class="role-column"><div class="role-title dps"><i class="fa-solid fa-khanda"></i> Daño</div><div id="dpsStrong"></div></div>
            <div class="role-column"><div class="role-title support"><i class="fa-solid fa-leaf"></i> Apoyo</div><div id="supportStrong"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="roster-section">
      <div class="roster-header">
        <h3><i class="fa-solid fa-users-rectangle"></i> Roster Completo</h3>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar héroe por nombre..." oninput="filterHeroes()">
      </div>
      
      <div class="roster-columns">
        <div class="role-group">
          <h4 style="color: var(--tank-color);"><i class="fa-solid fa-shield"></i> Tanques</h4>
          <div class="hero-grid" id="rosterTank"></div>
        </div>
        <div class="role-group">
          <h4 style="color: var(--dps-color);"><i class="fa-solid fa-khanda"></i> Daño</h4>
          <div class="hero-grid" id="rosterDamage"></div>
        </div>
        <div class="role-group">
          <h4 style="color: var(--support-color);"><i class="fa-solid fa-leaf"></i> Apoyo</h4>
          <div class="hero-grid" id="rosterSupport"></div>
        </div>
      </div>
    </div>

  </div>

    let selectedHeroKey = "D.Va";
    let apiHeroesData = {};

    function init() {
      fetchApiData().then(() => {
        renderRoster();
        selectHero(selectedHeroKey);
      });
    }

    async function fetchApiData() {
      try {
        const response = await fetch('https://overfast-api.tekrop.fr/heroes');
        const data = await response.json();
        data.forEach(hero => { apiHeroesData[hero.key] = hero; });
      } catch (error) {
        console.error("No se pudo conectar a la API de OverFast", error);
      }
    }

    function getHeroApiFormat(name) {
      if(!name) return '';
      return name.toLowerCase().replace(/:\s/g, '-').replace(/\./g, '').replace(/\s/g, '-');
    }

    function getAvatarUrl(name) {
      const apiKey = getHeroApiFormat(name);
      if (apiHeroesData[apiKey]) {
        return apiHeroesData[apiKey].portrait;
      }
      const role = HEROES_DB[name]?.role;
      let color = role === 'Tank' ? '2b7fff' : (role === 'Damage' ? 'e84545' : '00ca65');
      return `https://api.dicebear.com/7.x/initials/svg?seed=${name}&backgroundColor=${color}&textColor=ffffff&fontWeight=700`;
    }

    function renderRoster() {
      const tankBox = document.getElementById('rosterTank');
      const damageBox = document.getElementById('rosterDamage');
      const supportBox = document.getElementById('rosterSupport');

      tankBox.innerHTML = ''; damageBox.innerHTML = ''; supportBox.innerHTML = '';

      Object.keys(HEROES_DB).sort().forEach(key => {
        const hData = HEROES_DB[key];
        const btn = document.createElement('button');
        btn.className = `hero-btn ${key === selectedHeroKey ? 'active' : ''}`;
        btn.dataset.name = key;
        btn.onclick = () => {
          selectHero(key);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        btn.innerHTML = `<img src="${getAvatarUrl(key)}" alt="${key}">`;

        if (hData.role === 'Tank') tankBox.appendChild(btn);
        else if (hData.role === 'Damage') damageBox.appendChild(btn);
        else if (hData.role === 'Support') supportBox.appendChild(btn);
      });
    }

    function selectHero(heroName) {
      selectedHeroKey = heroName;
      const data = HEROES_DB[heroName];
      if (!data) return;

      document.getElementById('targetName').innerText = heroName;
      document.getElementById('targetRole').innerHTML = data.role === 'Damage' ? '<i class="fa-solid fa-khanda"></i> Daño' : (data.role === 'Tank' ? '<i class="fa-solid fa-shield"></i> Tanque' : '<i class="fa-solid fa-leaf"></i> Apoyo');
      
      const roleClass = data.role === 'Tank' ? 'role-tank' : (data.role === 'Damage' ? 'role-damage' : 'role-support');
      document.getElementById('targetRole').className = `hero-role-badge ${roleClass}`;
      
      const targetImg = document.getElementById('targetImg');
      targetImg.innerHTML = `<img src="${getAvatarUrl(heroName)}" alt="${heroName}">`;
      targetImg.style.borderColor = data.role === 'Tank' ? 'var(--tank-color)' : (data.role === 'Damage' ? 'var(--dps-color)' : 'var(--support-color)');

      document.querySelectorAll('.hero-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.name === heroName);
      });

      renderStats(heroName, data);
      renderCounters(data.counters || []);
      renderStrongAgainst(data.strong_against || []);
    }

    async function renderStats(heroName, data) {
      const apiKey = getHeroApiFormat(heroName);
      
      document.getElementById('statHealth').innerText = "-";
      document.getElementById('statArmor').innerText = "-";
      document.getElementById('statShield').innerText = "-";

      if (apiHeroesData[apiKey]) {
        try {
          const res = await fetch(`https://overfast-api.tekrop.fr/heroes/${apiKey}`);
          const detail = await res.json();
          
          if(detail.hitpoints) {
            document.getElementById('statHealth').innerText = detail.hitpoints.health || 0;
            document.getElementById('statArmor').innerText = detail.hitpoints.armor || 0;
            document.getElementById('statShield').innerText = detail.hitpoints.shields || 0;
          }
        } catch(e) {}
      } else {
        document.getElementById('statHealth').innerText = data.role === 'Tank' ? '450' : '250';
        document.getElementById('statArmor').innerText = data.role === 'Tank' ? '100' : '0';
        document.getElementById('statShield').innerText = "0";
      }

      const pContainer = document.getElementById('perksContainer');
      if (data.perks) {
        pContainer.style.display = 'block';
        document.getElementById('perkMinor').innerText = data.perks.minor;
        document.getElementById('perkMajor').innerText = data.perks.major;
      } else {
        pContainer.style.display = 'none';
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    function renderStars(count) {
      let html = '<div class="stars-container">';
      for(let i=1; i<=5; i++) {
        html += `<i class="fa-solid fa-star ${i <= count ? 'star-filled' : 'star-empty'}"></i>`;
      }
      html += '</div>';
      return html;
    }
    
    function getCategoryData(stars) {
        if(stars === 5) return { class: 'cat-hard', text: 'Hard Counter', itemClass: 'star-5' };
        if(stars === 4) return { class: 'cat-favorable', text: 'Muy Favorable', itemClass: 'star-4' };
        if(stars === 3) return { class: 'cat-light', text: 'Ventaja Ligera', itemClass: 'star-3' };
        if(stars === 2) return { class: 'cat-skill', text: 'Skill Matchup', itemClass: 'star-2' };
        return { class: '', text: 'Desventaja', itemClass: 'star-1' };
    }

    function createCardHTML(heroName, stars, reason, isSynergy = false) {
      const catData = getCategoryData(stars);
      const customClass = isSynergy ? 'synergy' : catData.itemClass;
      const catBadge = isSynergy ? '' : `<span class="counter-category ${catData.class}">${catData.text}</span>`;
      const starsHtml = isSynergy ? '' : renderStars(stars);
      const reasonHtml = reason ? `<div class="counter-reason">${reason}</div>` : '';
      
      return `
        <div class="counter-item ${customClass}" onclick="selectHero('${heroName}'); window.scrollTo({ top: 0, behavior: 'smooth' });">
          <div class="counter-header">
            <div class="counter-img"><img src="${getAvatarUrl(heroName)}" alt="${heroName}"></div>
            <div style="display:flex; flex-direction:column; flex-grow:1;">
                <span class="counter-name">${heroName}</span>
                ${starsHtml}
            </div>
            ${catBadge}
          </div>
          ${reasonHtml}
        </div>
      `;
    }

    function renderCounters(countersList) {
      const tankBox = document.getElementById('tankCounters');
      const dpsBox = document.getElementById('dpsCounters');
      const supportBox = document.getElementById('supportCounters');

      tankBox.innerHTML = ''; dpsBox.innerHTML = ''; supportBox.innerHTML = '';
      
      // Sort counters by stars descending
      countersList.sort((a, b) => b.stars - a.stars);

      countersList.forEach(item => {
        const heroData = HEROES_DB[item.name];
        if(!heroData) return;

        const cardHTML = createCardHTML(item.name, item.stars, item.reason);

        if (heroData.role === 'Tank') tankBox.innerHTML += cardHTML;
        else if (heroData.role === 'Damage') dpsBox.innerHTML += cardHTML;
        else if (heroData.role === 'Support') supportBox.innerHTML += cardHTML;
      });

      if(tankBox.innerHTML === '') tankBox.innerHTML = '<span style="color:var(--text-muted); font-size:0.9rem; padding:10px; display:block; text-align:center;">Ninguno destacable en este rol.</span>';
      if(dpsBox.innerHTML === '') dpsBox.innerHTML = '<span style="color:var(--text-muted); font-size:0.9rem; padding:10px; display:block; text-align:center;">Ninguno destacable en este rol.</span>';
      if(supportBox.innerHTML === '') supportBox.innerHTML = '<span style="color:var(--text-muted); font-size:0.9rem; padding:10px; display:block; text-align:center;">Ninguno destacable en este rol.</span>';
    }

    function renderStrongAgainst(strongList) {
      const tankBox = document.getElementById('tankStrong');
      const dpsBox = document.getElementById('dpsStrong');
      const supportBox = document.getElementById('supportStrong');

      tankBox.innerHTML = ''; dpsBox.innerHTML = ''; supportBox.innerHTML = '';
      
      // Sort by stars descending
      strongList.sort((a, b) => b.stars - a.stars);

      strongList.forEach(item => {
          const enemyData = HEROES_DB[item.name];
          if(!enemyData) return;
          
          const cardHTML = createCardHTML(item.name, item.stars, item.reason); // reason is optional here
          
          if (enemyData.role === 'Tank') tankBox.innerHTML += cardHTML;
          else if (enemyData.role === 'Damage') dpsBox.innerHTML += cardHTML;
          else if (enemyData.role === 'Support') supportBox.innerHTML += cardHTML;
      });

      if(tankBox.innerHTML === '') tankBox.innerHTML = '<span style="color:var(--text-muted); font-size:0.9rem; padding:10px; display:block; text-align:center;">No destaca contra este rol.</span>';
      if(dpsBox.innerHTML === '') dpsBox.innerHTML = '<span style="color:var(--text-muted); font-size:0.9rem; padding:10px; display:block; text-align:center;">No destaca contra este rol.</span>';
      if(supportBox.innerHTML === '') supportBox.innerHTML = '<span style="color:var(--text-muted); font-size:0.9rem; padding:10px; display:block; text-align:center;">No destaca contra este rol.</span>';
    }

    function filterHeroes() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.hero-btn').forEach(btn => {
        const name = btn.dataset.name.toLowerCase();
        btn.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }
